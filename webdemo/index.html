<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>PINNfluence</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>PINNteractive PINNfluence Demo</h1>
          <p id="runMeta" class="muted">Loading static data</p>
        </div>
        <div class="topbar-controls">
          <label>
            <span>Run</span>
            <select id="runSelect"></select>
          </label>
          <button id="resetButton" class="icon-button" title="Reset selection" aria-label="Reset selection">
            <span aria-hidden="true">R</span>
          </button>
        </div>
      </header>

      <section id="message" class="message" hidden></section>

      <section class="workspace">
        <aside class="control-panel">
          <div class="control-group">
            <label>
              <span>Field</span>
              <select id="fieldSelect"></select>
            </label>
            <div class="segmented" id="fieldKindButtons" role="group" aria-label="Field kind">
              <button data-kind="prediction" class="active">Prediction</button>
              <button data-kind="loss">Loss</button>
            </div>
          </div>

          <div class="control-group">
            <label>
              <span>Influence</span>
              <select id="matrixSelect"></select>
            </label>
            <div class="segmented" id="signButtons" role="group" aria-label="Influence sign">
              <button data-sign="abs" class="active">|·|</button>
              <button data-sign="pos">+</button>
              <button data-sign="neg">-</button>
            </div>
          </div>

          <div class="control-group">
            <label>
              <span>Selection</span>
            </label>
            <div class="segmented" id="selectionModeButtons" role="group" aria-label="Selection mode">
              <button data-mode="point" class="active">Point</button>
              <button data-mode="region">Region</button>
            </div>
          </div>

          <div class="control-group">
            <label>
              <span>Top k</span>
              <output id="kOutput">25</output>
              <input id="kSlider" type="range" min="1" max="200" value="25" />
            </label>
          </div>

          <div class="control-group">
            <label>
              <span>Global</span>
              <select id="summarySelect">
                <option value="mean_abs">Mean |influence|</option>
                <option value="mean_signed">Mean signed</option>
                <option value="max_abs">Max |influence|</option>
                <option value="positive_mass">Positive mass</option>
                <option value="negative_mass">Negative mass</option>
              </select>
            </label>
          </div>

          <dl class="stats">
            <div>
              <dt id="selectedPointLabel">Point</dt>
              <dd id="selectedPoint">-</dd>
            </div>
            <div>
              <dt id="selectedValueLabel">Value</dt>
              <dd id="selectedValue">-</dd>
            </div>
            <div>
              <dt>Training Points</dt>
              <dd id="trainCount">-</dd>
            </div>
            <div>
              <dt>Candidate Points</dt>
              <dd id="candidateCount">-</dd>
            </div>
          </dl>
        </aside>

        <section id="plotGrid" class="plot-grid" data-layout="row">
          <article class="plot-panel model-panel">
            <div class="plot-header">
              <h2 id="mainTitle">Model</h2>
              <span id="mainRange" class="muted"></span>
            </div>
            <div class="plot-body">
              <canvas id="mainCanvas"></canvas>
              <svg id="mainSvg" class="plot-overlay" aria-hidden="true"></svg>
            </div>
          </article>

          <article id="trainPanel" class="plot-panel train-panel">
            <div class="plot-header train-header">
              <div class="plot-title-group">
                <h2 id="trainTitle">Train</h2>
                <span id="trainRange" class="muted"></span>
              </div>
              <div class="segmented train-mode" id="trainModeButtons" role="group" aria-label="Train plot mode">
                <button data-train-mode="local" class="active">Local</button>
                <button data-train-mode="global">Global</button>
              </div>
            </div>
            <div class="plot-body">
              <canvas id="trainCanvas"></canvas>
              <svg id="trainSvg" class="plot-overlay" aria-hidden="true"></svg>
            </div>
          </article>
        </section>
      </section>
    </main>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
