<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>PINNfluence</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-copy">
          <h1>PINNteractive PINNfluence Demo</h1>
          <p id="runMeta" class="muted">Loading static data</p>
        </div>
        <div class="topbar-actions">
          <nav class="topbar-links" aria-label="Project links">
            <a class="topbar-link" href="https://arxiv.org/abs/2409.08958" target="_blank" rel="noopener noreferrer">arXiv</a>
            <a class="topbar-link" href="https://github.com/aleks-krasowski/PINNfluence/" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a class="topbar-link" href="./legal/privacy.html">Privacy</a>
            <a class="topbar-link" href="./legal/impressum.html">Impressum</a>
          </nav>
          <div class="topbar-controls">
            <label class="topbar-control problem-control">
              <span>Problem</span>
              <select id="problemSelect"></select>
            </label>
            <div class="topbar-control quality-control">
              <span>Model</span>
              <div class="segmented quality-switch" id="qualityButtons" role="group" aria-label="Model quality">
                <button type="button" data-model-quality="good" class="active">Good</button>
                <button type="button" data-model-quality="bad">Bad</button>
              </div>
            </div>
            <button id="resetButton" class="icon-button" title="Reset selection" aria-label="Reset selection">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M6.2 7.4A8 8 0 1 1 4 12" />
                <path d="M6.2 7.4H3.5V4.7" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <section id="message" class="message" hidden></section>

      <section class="workspace">
        <section id="plotGrid" class="plot-grid" data-layout="row">
          <article id="modelPanel" class="plot-panel model-panel">
            <div class="plot-header">
              <div class="plot-title-group">
                <h2 id="mainTitle">Model</h2>
                <span id="mainRange" class="muted"></span>
              </div>
              <div class="selection-readout" aria-live="polite">
                <span id="selectedPointLabel" class="readout-label">Point</span>
                <span id="selectedPoint" class="readout-value">-</span>
                <span id="selectedValueLabel" class="readout-label">Value</span>
                <span id="selectedValue" class="readout-value">-</span>
              </div>
              <div class="plot-actions model-actions">
                <div class="plot-controls model-controls">
                  <div class="plot-control field-control">
                    <select id="fieldSelect" aria-label="Field"></select>
                  </div>
                </div>
              </div>
            </div>
            <div class="plot-body">
              <canvas id="mainCanvas"></canvas>
              <svg id="mainSvg" class="plot-overlay" aria-hidden="true"></svg>
              <div
                id="modelInteractionHint"
                class="model-interaction-hint"
                role="status"
                aria-live="polite"
                aria-hidden="true"
                data-state="hidden"
                hidden
              >
                Click or Drag to see Influences.
              </div>
            </div>
          </article>

          <article id="trainPanel" class="plot-panel train-panel">
            <div class="plot-header train-header">
              <div class="plot-title-group">
                <h2 id="trainTitle">Train</h2>
                <span id="trainRange" class="muted"></span>
              </div>
              <div class="plot-actions train-actions">
                <div class="plot-controls train-controls">
                  <div class="plot-control matrix-control">
                    <select id="matrixSelect" aria-label="Influence"></select>
                  </div>
                  <div class="plot-control sign-control">
                    <div class="segmented" id="signButtons" role="group" aria-label="Influence sign">
                      <button data-sign="abs" class="active" aria-label="Absolute influence">|·|</button>
                      <button data-sign="pos" aria-label="Positive influence">+</button>
                      <button data-sign="neg" aria-label="Negative influence">-</button>
                    </div>
                  </div>
                  <label id="kControl" class="plot-control k-control">
                    <output id="kOutput" for="kSlider" aria-hidden="true">25</output>
                    <input id="kSlider" type="range" min="0" max="256" value="25" aria-label="Top k" />
                  </label>
                  <div id="backgroundControl" class="plot-control background-control">
                    <div class="segmented" id="backgroundButtons" role="group" aria-label="Influence background">
                      <button data-background-mode="points" class="active" aria-label="Points background">Points</button>
                      <button data-background-mode="smooth" aria-label="Smooth background">Smooth</button>
                      <button data-background-mode="cell" aria-label="Cells background">Cells</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="plot-body">
              <canvas id="trainCanvas"></canvas>
              <svg id="trainSvg" class="plot-overlay" aria-hidden="true"></svg>
            </div>
          </article>
        </section>
      </section>
    </main>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
