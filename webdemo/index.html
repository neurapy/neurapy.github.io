<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>PINNfluence</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <a class="hhi-logo" href="https://www.hhi.fraunhofer.de/en/" target="_blank" rel="noopener noreferrer" aria-label="Fraunhofer HHI">
            <img src="./brand/hhi_logo_en.svg" alt="Fraunhofer HHI" />
          </a>
          <div class="topbar-copy">
            <h1>PINNteractive PINNfluence Demo</h1>
            <p id="runMeta" class="muted">Loading static data</p>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="topbar-controls">
            <div class="topbar-control view-control">
              <div class="segmented view-switch" id="viewButtons" role="group" aria-label="Workspace view">
                <button type="button" data-app-view="explainer">EXPLAINER</button>
                <button type="button" data-app-view="playground" class="active">PLAYGROUND</button>
                <button type="button" data-app-view="indicators">INDICATORS</button>
              </div>
            </div>
            <label class="topbar-control problem-control">
              <span>Problem</span>
              <select id="problemSelect"></select>
            </label>
            <div class="topbar-control quality-control">
              <span>Model</span>
              <div class="segmented quality-switch" id="qualityButtons" role="group" aria-label="Model quality">
                <button type="button" data-model-quality="good" class="active">Well-Trained</button>
                <button type="button" data-model-quality="bad">Poorly-Trained</button>
              </div>
            </div>
          </div>
        </div>
        <nav class="topbar-links" aria-label="Project links">
          <a class="topbar-link" href="https://arxiv.org/abs/2409.08958" target="_blank" rel="noopener noreferrer">arXiv</a>
          <a class="topbar-link" href="https://github.com/aleks-krasowski/PINNfluence/" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
      </header>

      <section id="message" class="message" hidden></section>

      <section id="playgroundWorkspace" class="workspace playground-workspace">
        <section id="plotGrid" class="plot-grid" data-layout="row">
          <article id="modelPanel" class="plot-panel model-panel">
            <div class="plot-header">
              <div class="plot-title-group">
                <h2 id="mainTitle">Model</h2>
                <p id="modelMeta" class="model-meta" aria-live="polite" hidden></p>
              </div>
              <div class="selection-readout" aria-live="polite">
                <span class="readout-item readout-point">
                  <span id="selectedPointLabel" class="readout-label">Point</span>
                  <span id="selectedPoint" class="readout-value">-</span>
                </span>
                <span class="readout-item readout-scalar">
                  <span id="selectedValueLabel" class="readout-label">Value</span>
                  <span id="selectedValue" class="readout-value">-</span>
                </span>
              </div>
              <div class="plot-actions model-actions">
                <div class="plot-controls model-controls">
                  <div class="plot-control field-control">
                    <select id="fieldSelect" aria-label="Field"></select>
                  </div>
                </div>
              </div>
            </div>
            <div class="plot-body">
              <canvas id="mainCanvas"></canvas>
              <svg id="mainSvg" class="plot-overlay" aria-hidden="true"></svg>
              <div
                id="modelInteractionHint"
                class="model-interaction-hint"
                role="status"
                aria-live="polite"
                aria-hidden="true"
                data-state="hidden"
                hidden
              >
                Click or Drag to see Influences.
              </div>
            </div>
          </article>

          <article id="trainPanel" class="plot-panel train-panel">
            <div class="plot-header train-header">
              <div class="plot-title-group">
                <h2 id="trainTitle">Training</h2>
              </div>
              <div class="plot-actions train-actions">
                <div class="plot-controls train-controls">
                  <div class="plot-control matrix-control">
                    <select id="matrixSelect" aria-label="Influence"></select>
                  </div>
                  <div class="plot-control sign-control">
                    <div class="segmented" id="signButtons" role="group" aria-label="Influence sign">
                      <button data-sign="abs" class="active" aria-label="Absolute influence">|I|</button>
                      <button data-sign="pos" aria-label="Positive influence">I⁺</button>
                      <button data-sign="neg" aria-label="Negative influence">I⁻</button>
                    </div>
                  </div>
                  <label id="kControl" class="plot-control k-control">
                    <output id="kOutput" for="kSlider" aria-hidden="true">25</output>
                    <input id="kSlider" type="range" min="0" max="256" value="25" aria-label="Top k" />
                  </label>
                  <div id="backgroundControl" class="plot-control background-control">
                    <div class="segmented" id="backgroundButtons" role="group" aria-label="Influence background">
                      <button data-background-mode="points" class="active" aria-label="Points background">Pts</button>
                      <button data-background-mode="smooth" aria-label="Smooth background">KDE</button>
                      <button data-background-mode="cell" aria-label="Cells background">Cell</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="plot-body">
              <canvas id="trainCanvas"></canvas>
              <svg id="trainSvg" class="plot-overlay" aria-hidden="true"></svg>
              <span id="trainRange" class="train-summary-badge" aria-live="polite"></span>
            </div>
          </article>
        </section>
      </section>

      <section id="explainerWorkspace" class="workspace explainer-workspace" hidden></section>

      <section id="resultsWorkspace" class="workspace results-workspace" hidden>
        <div class="results-shell" data-state="loading">
          <div class="results-empty">Loading indicators</div>
        </div>
      </section>

      <footer class="legal-footer" aria-label="Legal information">
        <nav class="legal-footer-links" aria-label="Legal links">
          <a class="legal-footer-link" href="./legal/privacy.html">Privacy</a>
          <a class="legal-footer-link" href="./legal/impressum.html">Legal Notice</a>
        </nav>
        <span class="legal-footer-copyright">© Fraunhofer HHI</span>
      </footer>
    </main>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
