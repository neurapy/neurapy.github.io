<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>PINNfluence</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>PINNteractive PINNfluence Demo</h1>
          <p id="runMeta" class="muted">Loading static data</p>
        </div>
        <div class="topbar-controls">
          <label>
            <span>Run</span>
            <select id="runSelect"></select>
          </label>
          <button id="resetButton" class="icon-button" title="Reset selection" aria-label="Reset selection">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6.2 7.4A8 8 0 1 1 4 12" />
              <path d="M6.2 7.4H3.5V4.7" />
            </svg>
          </button>
        </div>
      </header>

      <section id="message" class="message" hidden></section>

      <section class="workspace">
        <section id="plotGrid" class="plot-grid" data-layout="row">
          <article id="modelPanel" class="plot-panel model-panel">
            <div class="plot-header">
              <div class="plot-title-group">
                <h2 id="mainTitle">Model</h2>
                <span id="mainRange" class="muted"></span>
              </div>
              <div class="selection-readout" aria-live="polite">
                <span id="selectedPointLabel" class="readout-label">Point</span>
                <span id="selectedPoint" class="readout-value">-</span>
                <span id="selectedValueLabel" class="readout-label">Value</span>
                <span id="selectedValue" class="readout-value">-</span>
              </div>
              <div class="plot-actions model-actions" data-control-layout="menu" data-open="false">
                <button
                  id="modelMenuButton"
                  class="icon-button menu-button"
                  type="button"
                  title="Model controls"
                  aria-label="Model controls"
                  aria-expanded="false"
                  aria-controls="modelMenu"
                >
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <circle cx="5" cy="12" r="1.6" />
                    <circle cx="12" cy="12" r="1.6" />
                    <circle cx="19" cy="12" r="1.6" />
                  </svg>
                </button>
                <div id="modelMenu" class="plot-menu model-menu" role="menu">
                  <label class="plot-control field-control">
                    <span>Field</span>
                    <select id="fieldSelect"></select>
                  </label>
                  <div class="plot-control kind-control">
                    <span>Kind</span>
                    <div class="segmented" id="fieldKindButtons" role="group" aria-label="Field kind">
                      <button data-kind="prediction" class="active">Prediction</button>
                      <button data-kind="loss">Loss</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="plot-body">
              <canvas id="mainCanvas"></canvas>
              <svg id="mainSvg" class="plot-overlay" aria-hidden="true"></svg>
            </div>
          </article>

          <article id="trainPanel" class="plot-panel train-panel">
            <div class="plot-header train-header">
              <div class="plot-title-group">
                <h2 id="trainTitle">Train</h2>
                <span id="trainRange" class="muted"></span>
              </div>
              <div class="plot-actions train-actions" data-control-layout="menu" data-open="false">
                <button
                  id="trainMenuButton"
                  class="icon-button menu-button"
                  type="button"
                  title="Train controls"
                  aria-label="Train controls"
                  aria-expanded="false"
                  aria-controls="trainMenu"
                >
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <circle cx="5" cy="12" r="1.6" />
                    <circle cx="12" cy="12" r="1.6" />
                    <circle cx="19" cy="12" r="1.6" />
                  </svg>
                </button>
                <div id="trainMenu" class="plot-menu train-menu" role="menu">
                  <label class="plot-control matrix-control">
                    <span>Influence</span>
                    <select id="matrixSelect"></select>
                  </label>
                  <div class="plot-control sign-control">
                    <span>Sign</span>
                    <div class="segmented" id="signButtons" role="group" aria-label="Influence sign">
                      <button data-sign="abs" class="active">|·|</button>
                      <button data-sign="pos">+</button>
                      <button data-sign="neg">-</button>
                    </div>
                  </div>
                  <label id="kControl" class="plot-control k-control">
                    <span>Top k <output id="kOutput" for="kSlider">25</output></span>
                    <input id="kSlider" type="range" min="0" max="256" value="25" />
                  </label>
                  <div id="backgroundControl" class="plot-control background-control">
                    <span>Background</span>
                    <div class="segmented" id="backgroundButtons" role="group" aria-label="Influence background">
                      <button data-background-mode="points" class="active">Points</button>
                      <button data-background-mode="linear">Linear</button>
                      <button data-background-mode="cell">Cell</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="plot-body">
              <canvas id="trainCanvas"></canvas>
              <svg id="trainSvg" class="plot-overlay" aria-hidden="true"></svg>
            </div>
          </article>
        </section>
      </section>
    </main>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
