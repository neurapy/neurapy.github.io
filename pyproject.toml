[project]
name = "pinnfluence_vis"
version = "1.0.0"
description = "For ICML 2026"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
  { name = "Gerrit Dolderer", email = "gerrit.dolderer@hhi.fraunhofer.de" },
]
requires-python = ">=3.14"
dependencies = [
  "captum @ git+https://github.com/aleks-krasowski/captum.git",
  "deepxde @ git+https://github.com/aleks-krasowski/deepxde.git",
  "jupyter",
  "matplotlib",
  "numpy",
  "pandas",
  "pip",
  "torch",
  "wandb",
]
keywords = []
classifiers = []

[dependency-groups]
dev = ["pre-commit", "pyright", "pytest>=9.0", "ruff", "taplo"]
streamlit_demo = ["fastapi", "plotly", "streamlit", "uvicorn"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "B006", # Existing debt: mutable default arguments.
  "B007", # Existing debt: unused loop variables.
  "B904", # Existing debt: exception chaining.
  "B905", # Existing debt: explicit zip(strict=...).
  "E712", # Existing debt: true/false comparisons.
  "E722", # Existing debt: bare except.
  "F601", # Existing debt: repeated dictionary keys.
  "F841", # Existing debt: unused locals.
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
]
include = ["src"]
pythonVersion = "3.14"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
typeCheckingMode = "off"
useLibraryCodeForTypes = true
venv = ".venv"
venvPath = "."

[tool.pytest]
addopts = ["-ra"]
minversion = "9.0"
pythonpath = ["src"]
strict = true
testpaths = ["tests"]

[tool.taplo]
include = ["pyproject.toml"]

[tool.taplo.formatting]
allowed_blank_lines = 1
array_auto_collapse = false
column_width = 100
indent_string = "    "
